name: Wheels

on:
  pull_request:
  push:
    branches:
      - main
      - test
      - jpfeuffer-sgkit-plink-fork-ci
    tags:
      - '*'
  release:
    types: [published]

jobs:
  build:
    # Fork-only CI branch; never enable publishing for this exception.
    if: github.repository_owner == 'sgkit-dev' || (github.repository == 'jpfeuffer/sgkit' && github.ref == 'refs/heads/jpfeuffer-sgkit-plink-fork-ci' && github.event_name == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --locked --only-group packaging --python "${{ matrix.python-version }}"
    - name: Build a source distribution and a wheel
      run: |
        uv build --no-sources --python "${{ matrix.python-version }}"
        uv run --locked --only-group packaging twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        path: dist

  unix-test:
    if: github.repository_owner == 'sgkit-dev' || (github.repository == 'jpfeuffer/sgkit' && github.ref == 'refs/heads/jpfeuffer-sgkit-plink-fork-ci' && github.event_name == 'push')
    needs: ['build']
    strategy:
      fail-fast: ${{ github.repository != 'jpfeuffer/sgkit' }}
      matrix:
        os: ${{ fromJSON(github.repository == 'jpfeuffer/sgkit' && '["ubuntu-latest", "macos-14", "macos-15-intel"]' || '["ubuntu-latest", "macos-latest"]') }}
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout repo to subdirectory to get access to scripts
      - uses: actions/checkout@v7
        with:
          path: sgkit-copy
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install wheel and test
        run: |
          python -VV
          # Intel macOS also needs binary Numba/llvmlite releases.
          wheel=$(ls artifact/sgkit-*.whl)
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv --only-binary "${{ github.repository == 'jpfeuffer/sgkit' && matrix.os == 'macos-15-intel' && 'scipy,numba,llvmlite' || 'scipy' }}" "${wheel}"
          uv run --no-sync python sgkit-copy/.github/scripts/test_sgkit.py
      - name: Verify macOS ARM architecture
        if: matrix.os == 'macos-14'
        run: |
          uname -a
          test "$(uname -m)" = arm64
          uv run --no-sync python -c "import platform, sys; print(sys.version); print(platform.platform()); print(platform.machine()); assert platform.machine() == 'arm64'"

  windows-test:
    if: github.repository_owner == 'sgkit-dev' || (github.repository == 'jpfeuffer/sgkit' && github.ref == 'refs/heads/jpfeuffer-sgkit-plink-fork-ci' && github.event_name == 'push')
    runs-on: windows-latest
    needs: ['build']
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      # checkout repo to subdirectory to get access to scripts
      - uses: actions/checkout@v7
        with:
          path: sgkit-copy
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install wheel and test
        run: |
          python -VV
          # Avoid building SciPy from source in CI.
          $wheel = (Get-ChildItem artifact/sgkit-*.whl).FullName
          uv venv --python "${{ matrix.python-version }}"
          uv pip install --python .venv --only-binary scipy "${wheel}"
          uv run --no-sync python sgkit-copy/.github/scripts/test_sgkit.py


  pypi-upload:
    if: github.repository == 'sgkit-dev/sgkit' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release')
    runs-on: ubuntu-latest
    needs: ['unix-test', 'windows-test']
    steps:
      - name: Download all
        uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact
      - name: Move to dist
        run: |
          mkdir dist
          cp ./*/*.{whl,gz} dist/.
      - name: Publish package to TestPyPI
        if: github.repository == 'sgkit-dev/sgkit' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package to PyPI
        if: github.repository == 'sgkit-dev/sgkit' && github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
